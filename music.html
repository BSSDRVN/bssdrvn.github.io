<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music — Adam Nordquist</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="music-page">

  <header class="site-header music-header">
    <a href="index.html" class="site-name">ANORD</a>
    <a href="index.html" class="back-link">← home</a>
  </header>

  <main class="music-columns">

    <!-- TROMBONE -->
    <section class="music-section trombone-section">
      <div class="music-heading">
        <p class="eyebrow">PERFORMER</p>
        <h1>Trombone</h1>
      </div>

      <div class="music-gallery">
        <img
          src="images/trombone-01.jpeg"
          alt="Playing with the Gustavus Jazz Ensemble"
          class="tall"
        >

        <!-- Add more trombone photos here -->
        <img
          src="images/trombone-02.jpg"
          alt="Playing trombone"
        >
      </div>

      <div class="music-description">
        <p>
          Trombonist performing in ensembles, concerts, and live events.
          <!-- Replace this with whatever you actually want to say. -->
        </p>
      </div>
    </section>


    <!-- DJ -->
    <section class="music-section dj-section">
      <div class="music-heading">
        <p class="eyebrow">DJ / OPEN FORMAT</p>
        <h1>DJ</h1>
      </div>

      <div class="music-gallery">
        <img
          src="images/dj-01.jpg"
          alt="DJing at a live event"
        >

        <!-- Add more DJ photos here -->
        <img
          src="images/dj-02.jpg"
          alt="DJing at an event"
        >
      </div>

      <div class="music-description">
        <p>
          Open-format DJ for weddings, parties, school events, and whatever
          else needs a good soundtrack.
        </p>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    © 2026 Adam Nordquist
  </footer>

</body>
</html>
